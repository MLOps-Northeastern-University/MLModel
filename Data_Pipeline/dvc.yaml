# The same pipeline as the Airflow DAG, runnable with `dvc repro`. After an
# Airflow run, the DAG's dvc_version task records the outputs with
# `dvc commit -f build_dataset`, updating dvc.lock.
#
# Outputs are versioned by DVC, not Git: dvc.lock (in Git) records each one's hash,
# and `dvc push` / `dvc pull` move the files to and from the remote. The bias
# summary names no participants, so it's `cache: false` and kept in Git to read.
stages:
  build_dataset:
    cmd: python -m data_pipeline.pipeline --mode full
    deps:
      - data_pipeline
      - config/pipeline.yaml
      - config/ledd.yaml
    outs:
      # The model's inputs (Model_Pipeline/model_pipeline/core/data.py).
      - data/processed/hours.csv
      - data/processed/events.csv
      - data/processed/patients.csv
      - data/processed/windows
      - data/processed/dataset_meta.json
      # Reports that name participants stay out of Git.
      - data/reports/checks.json
      - data/reports/failed_participants.json
      - data/reports/label_issues.json
      - data/reports/wrist_agreement.csv
      - data/reports/bias_report.json
      - data/reports/bias_report.md:
          cache: false
