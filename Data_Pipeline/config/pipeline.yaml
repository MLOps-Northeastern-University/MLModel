# COPS data pipeline config.

data:
  osf_project_id: 5xvwn
  osf_api_url: https://api.osf.io/v2
  mode: sample              # sample: the N smallest zips; full: all
  sample_size: 5            # ignored when participants is set
  participants:  [COPS-1, COPS-2, COPS-3, COPS-4, COPS-5, COPS-7, COPS-8, COPS-9, COPS-10, COPS-11,
   COPS-12, COPS-13, COPS-14, COPS-15, COPS-16, COPS-17, COPS-18, COPS-19, COPS-20, COPS-21,
   COPS-22, COPS-23, COPS-24, COPS-25, COPS-26, COPS-27, COPS-28, COPS-29, COPS-30, COPS-31,
   COPS-32, COPS-33, COPS-34, COPS-35, COPS-36, COPS-37, COPS-38, COPS-39, COPS-40, COPS-42,
   COPS-43, COPS-44, COPS-45, COPS-46, COPS-47, COPS-48, COPS-49, COPS-53, COPS-54, COPS-55,
   COPS-56, COPS-57, COPS-58, COPS-60, COPS-61, COPS-62, COPS-63, COPS-64, COPS-65, COPS-66]
    # exactly these, whatever the mode
  # The model's 60 (all but the demo 6: COPS-6, 41, 50, 51, 52, 59):
  # delete_raw_after_processing: false
  max_failed_fraction: 0.2  # stop if more fail

run:
  parallel_participants: 4

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: data/reports
  log_file: logs/pipeline.log

download:
  timeout_seconds: 120
  max_retries: 3
  backoff_seconds: 5
  chunk_size_bytes: 1048576
  allowed_hosts: [osf.io]

files:
  csv_separator: ";"
  demographics_file: Demographics.csv
  participant_zip_pattern: "^COPS-\\d+\\.zip$"

wrist:
  choose: more_affected     # more_affected, left or right
  fallback: right           # when pd_dominantside is "both" or blank

sensor:
  sampling_rate_hz: 100
  accel_range_g: [-8.0, 8.0]      # clipped outside this
  max_sample_gap_seconds: 0.05    # a bigger gap splits the signal

windows:                    # must match Model_Pipeline/config/model.yaml
  spec_version: 1
  seconds: 10
  rate_hz: 30
  axes: 3

orientation:
  along_arm_axis: 0         # X
  mirror_axis: 1            # Y
  mirror_wrist: left        # left is mirrored to read like a right wrist
  rewear_gap_minutes: 30    # off this long = a new wear bout

wear:
  block_minutes: 30
  still_std_g: 0.013
  min_still_fraction: 0.95
  max_temp_c: 25.0

features:
  expected_seconds_per_file: 3600
  movement_band_hz: [0.1, 3.0]
  tremor_band_hz: [4.0, 8.0]
  filter_order: 4
  epoch_seconds: 1
  still_threshold_g: 0.01
  min_valid_seconds: 60

hours:                      # drop_reason thresholds
  min_valid_fraction: 0.8
  min_worn_fraction: 0.5

medication:
  ledd_table: config/ledd.yaml
  name_source: cops
  dose_offset_minutes: 30   # doses placed mid-hour

labels:
  kinesia_text_to_score:
    Severe Akinesia: -3
    Discomforting Akinesia: -2
    Slight Akinesia: -1
    Good Kinesia: 0
    Slight Dyskinesia: 1
    Discomforting Dyskinesia: 2
    Severe Dyskinesia: 3
  tremor_text_to_score:
    No Tremor: 0
    Weak Tremor: 1
    Slight Tremor: 1
    Strong Tremor: 2
    Severe Tremor: 2

demographics:
  column_map:               # Demographics.csv header -> our name
    id: participant_id
    subject: participant_id
    gender: sex
    "h&y": hoehn_yahr
    hoehn_and_yahr: hoehn_yahr
    hoehnyahr: hoehn_yahr
    pd_hoehnandyahr: hoehn_yahr
    subtype: pd_subtype
    deep_brain_stimulation: dbs
  age_bins: [0, 55, 65, 120]
  age_labels: ["<55", "55-64", "65+"]

bias:
  slice_columns: [sex, age_group, visit, dbs, hoehn_yahr, pd_subtype]

checks:
  agreement_hours: 12       # hours of both wrists compared
  min_labelled_hours: 24    # warn below this

alerts:
  email_enabled: true
  slack_enabled: true
