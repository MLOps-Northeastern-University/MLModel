name: Checks

# Every PR, and every push to dev or main (the merge itself), runs all six jobs at once. None
# of them touches GCP, so there's no id-token permission and no secret here.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The whole history, so gitleaks scans every commit: a key deleted in a later commit is still
        # in Git. A known false positive goes in .gitleaksignore at the repo's root.
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for organization repos, so run the CLI directly.
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose

  data-guard:
    name: Data file guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every file Git tracks (git ls-files), not only the PR's changes, so a file that got in earlier
      # still fails. The COPS data and anything made from it belong in DVC, never in this public repo.
      - name: Block data, model and large files
        run: |
          max_bytes=$((5 * 1024 * 1024))
          blocked='\.(csv|tsv|parquet|feather|h5|hdf5|pkl|pickle|joblib|npy|npz|pt|pth|ckpt|onnx|tflite|safetensors|edf|mat)$'
          # Small synthetic test data may live here (tests/fixtures/ in any folder). Never real or dataset-derived data.
          fixtures='(^|/)tests?/fixtures/'
          # The pipeline's data folders hold dataset-derived files of any type (JSON reports
          # name participants), so nothing in them may be committed except these. DVC versions the rest;
          # its .dvc pointer files (a hash and a size, no data) are allowed, such as the patient split's.
          data_dirs='(^|/)data/(raw|interim|processed|reports)/'
          allowed_in_data='/(\.gitkeep|bias_report\.md|[^/]+\.dvc)$'
          fail=0
          while IFS= read -r -d '' f; do
            if echo "$f" | grep -qiE "$blocked" && ! echo "$f" | grep -qE "$fixtures"; then
              echo "::error file=$f::Data or model files are not allowed in Git: $f"
              fail=1
            fi
            if echo "$f" | grep -qE "$data_dirs" && ! echo "$f" | grep -qE "$allowed_in_data"; then
              echo "::error file=$f::Pipeline data and reports are versioned by DVC, not Git: $f"
              fail=1
            fi
            if [ "$(stat -c%s "$f")" -gt "$max_bytes" ]; then
              echo "::error file=$f::File is over 5 MB: $f"
              fail=1
            fi
          done < <(git ls-files -z)
          if [ "$fail" -eq 0 ]; then echo "No data, model or large files found."; fi
          exit $fail

  pipeline:
    name: Data pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data_Pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The same Python as the data pipeline's Docker image, and the model pipeline's.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Data_Pipeline/requirements.txt
      # The full requirements, so a broken pin fails here before it fails on someone's machine.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 data_pipeline tests
      # Fails if coverage of data_pipeline/ drops below 85%.
      - name: Unit tests, with a coverage floor
        run: pytest -q --cov=data_pipeline --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=85
      # dvc dag only parses dvc.yaml and prints the stages in order: a broken stage or dependency
      # fails here, with no data pulled and no GCP access.
      - name: DVC reads the pipeline
        run: dvc dag

  model-pipeline:
    name: Model pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Model_Pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The same Python as the model pipeline's Docker image, and the data pipeline's.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Model_Pipeline/requirements.txt
      # PyTorch's CPU build first (about 200 MB; the default Linux build pulls in GBs of CUDA),
      # then the full requirements, so a broken pin fails here before it fails on someone's machine.
      - name: Install dependencies
        run: |
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 model_pipeline tests
      # The file a PR bumps to ask for training: a typo fails here, not at the merge that trains.
      - name: retrain.yaml is valid
        run: python -m model_pipeline.retrain_request check
      # The floor is 0 while most steps are still being built; it goes up to 85 once they're merged.
      - name: Unit tests, with a coverage floor
        run: pytest -q --cov=model_pipeline --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=0

  airflow:
    name: Airflow DAGs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airflow
    steps:
      - uses: actions/checkout@v7
      # The DAGs need Airflow and its Docker provider, which only the Airflow image has, so the
      # tests run in it: both DAGs load, their steps connect in order, each runs in its pipeline's image.
      # Airflow runs as the runner's own user, so it can write the mounted logs folder (on Linux, a
      # folder Docker makes is root's, and Airflow, user 50000 by default, can't write it).
      - name: Run Airflow as the runner's user
        run: |
          echo "AIRFLOW_UID=$(id -u)" > .env
          mkdir -p logs
      - name: Build the Airflow image
        run: docker compose build tests
      - name: DAG tests
        run: docker compose run --rm tests

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # A pinned version, so a new release's rules can't fail an unchanged PR. The rules are in
      # .markdownlint-cli2.yaml at the repo's root.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.14.0 "**/*.md"
