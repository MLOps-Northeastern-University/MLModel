name: WIF test

# Throwaway check that GitHub Actions can log in as the training service account
# through Workload Identity Federation. Delete this file once it has passed.
on:
  push:
    branches: [basim/cicd-p5]
    paths: [.github/workflows/wif-test.yml]
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job ask GitHub for the ID token that Google checks.
  id-token: write

jobs:
  gcs-access:
    name: List the buckets as training
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # Empty buckets print nothing; the step passing is what counts.
      - name: List both buckets
        run: |
          gcloud storage ls gs://${{ vars.GCP_PROJECT_ID }}-training-data
          gcloud storage ls gs://${{ vars.GCP_PROJECT_ID }}-models
