# Central configuration for the model pipeline.
# Every tunable value lives here so scripts contain no hard-coded settings.
# "Placeholder" values are set by their owner in Phase 0.

data:
  # The phone model's inputs, in the app's order (feature spec 3). The data
  # pipeline's table names them W_<name>, for whichever wrist it used.
  features: [move_mean, move_std, move_p95, still_fraction, tremor_mean, tremor_p95, tremor_ratio]
  feature_prefix: W_
  label_column: kinesia_class
  # Binary target: off (1) against on or dyskinetic (0).
  positive_class: "off"
  group_column: participant_id
  random_seed: 42

windows:
  # How the signal is cut into windows: the preprocessing spec the data pipeline
  # and the app must follow too. Bump spec_version whenever any value changes;
  # a Dataset cut with another version is refused. harnet10 was pretrained on
  # 10-s windows at 30 Hz, so changing these also means retraining the encoder.
  spec_version: 1
  seconds: 10
  rate_hz: 30
  axes: 3

paths:
  # The data pipeline's outputs, read by data/loaders.py. Get them with `dvc pull` in
  # ../Data_Pipeline. Only the files a model needs are read (see core/data.py, GROUPS).
  # Every diary hour, Sleep and No Data included: the labels and the bias columns.
  hours_csv: ../Data_Pipeline/data/processed/hours.csv
  # The 7 hourly features, for the baselines: the W_ columns of the same table.
  features_csv: ../Data_Pipeline/data/processed/hours.csv
  # 10-s windows: <participant>/signal.npy, time_s.npy, worn.npy, and manifest.json.
  windows_folder: ../Data_Pipeline/data/processed/windows
  events_csv: ../Data_Pipeline/data/processed/events.csv
  patients_csv: ../Data_Pipeline/data/processed/patients.csv
  # The patient split: the fixed test patients and the folds (scripts/data/folds.py). It names
  # patients, so it's kept with the data (git-ignored there) and versioned by DVC, never in Git.
  split_file: ../Data_Pipeline/data/processed/patient_split.json
  # Everything a run writes: predictions, reports and the model bundle. Not in Git.
  artifacts_dir: artifacts
  log_file: logs/model_pipeline.log
  # PLACEHOLDER: the released bundles, one folder per version. A local folder until
  # the team picks gs://team17-mlops-neu-models/parkinsons-risk or the Artifact
  # Registry bundles repository (infra/registry.tf).
  registry_dir: artifacts/registry

logging:
  level: INFO
  # console: readable text (local runs, CI). json: one JSON object per line on stdout,
  # which Cloud Logging and CloudWatch parse. Deployments set MODEL_LOG_FORMAT=json.
  format: console
  # How much MLflow, scikit-learn and other libraries may log.
  third_party_level: WARNING
  # The rotating file at paths.log_file. Containers set MODEL_LOG_FILE=0.
  file: true

split:
  # The patient split is a file (paths.split_file), made once and only added to, never
  # recomputed, so the test patients never change (scripts/data/folds.py). These two are
  # used when it's made or when development patients are added (which remakes the folds).
  # Folds by patient over the development patients, so no one is in both train and validation.
  cv_folds: 5
  seed: 42

models:
  # The candidates train trains and select chooses from (scripts/models/registry.py).
  # Every candidate predicts these targets at these horizons unless it sets its own.
  targets: [sleep, state, tremor]
  horizons: [now, next_hour]
  candidates:
    # The baselines: each 10-s window on its own, no past (MODEL.md, Experiment order, stage 0).
    # 15 of each labelled hour's windows to train on (the default is 60): about 4x faster to fit,
    # which tuning (many fits) needs on the CPU; predictions still use every window.
    - name: window_logistic
      family: window_logistic
      params: {windows_per_hour: 15}
    - name: window_boosting
      family: window_boosting
      params: {windows_per_hour: 15}
    # The window model (MODEL.md, Architecture and Training). Its settings are the defaults in
    # scripts/models/motor_causal_transformer/model.py; a block set here is merged into them.
    - name: motor_causal_transformer
      family: motor_causal_transformer
    # The same model without pretraining: whether pretraining earns its place.
    - name: motor_causal_transformer_no_pretrain
      family: motor_causal_transformer
      params: {pretrain: {epochs: 0}}

train:
  # scripts/steps/train.py. Every candidate trains with each seed on every fold; the cv
  # scores are the mean over seeds.
  seeds: [42, 43, 44]
  # Train the candidates tune.py tuned with the settings it chose (artifacts/tuned_params.json),
  # merged over their config. Refused if they were tuned on another split, data or config, or if
  # tune hasn't run yet: run tune first.
  use_tuned: true
  # The test patients are scored once, with the final models, at the very end of model
  # work. Leave false; set true only for that one run (it's tagged test_scored in MLflow).
  score_test: false
  charts:
    # scripts/reporting/: a scorecard and confusion matrices on every run with predictions (each
    # fold, each candidate's cross-validation, the test run), and the candidates compared on the
    # train run. Attached to the MLflow runs and kept in artifacts/charts/.
    enabled: true
    folds: true
    compare: [cv/state_now/off_auc, cv/state_now/off_auc_within, cv/state_now/score_spearman_within,
              cv/state_next_hour/off_auc_within, cv/tremor_now/any_tremor_auc_within,
              cv/sleep_now/asleep_auc_within]
  leakage_check:
    # Trained on labels shuffled among the training hours, these candidates must score
    # near chance: every AUC between 1 - max_auc and max_auc, or the run stops.
    candidates: [window_boosting]
    max_auc: 0.6

tune:
  # scripts/steps/tune.py. Each trial is a full cross-validation with this seed, scored by
  # selection.metric (so tuning maximises what selection chooses by). A candidate not listed
  # here isn't tuned. Settings are dotted names into the candidate's params.
  # Every family is tuned, with trials of about 8-10 per setting, so the comparison is fair.
  # Tuned in this order: the transformer first (on the GPU), then the CPU baselines.
  seed: 42
  candidates:
    motor_causal_transformer:
      # Diary-step settings only, so every trial reuses each fold's cached pretrained body.
      # Not diary.learn: the pooling only ever learns in the diary step, so it must stay learnable.
      # Trials to be set from a timing test on the training machine.
      trials: 25
      space:
        diary.lr: {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
        diary.weight_decay: {type: float, low: 0.01, high: 0.3, log: true}
        diary.feature_noise: {type: float, low: 0.0, high: 0.3}
        diary.class_weight_power: {type: float, low: 0.0, high: 1.0}
    window_logistic:
      trials: 25
      space:
        c: {type: float, low: 1.0e-4, high: 1.0, log: true}
        class_weight_power: {type: float, low: 0.0, high: 1.0}
    window_boosting:
      trials: 40
      space:
        learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
        leaves: {type: int, low: 7, high: 63}
        iterations: {type: int, low: 100, high: 500, step: 50}
        pca_components: {type: categorical, choices: [32, 64, 128]}
        class_weight_power: {type: float, low: 0.0, high: 1.0}
    # motor_causal_transformer_no_pretrain isn't tuned: after tuning, give it the transformer's
    # tuned diary settings in its params, so the two differ only in pretraining.

mlflow:
  # Local MLflow from docker-compose. CI sets MLFLOW_TRACKING_URI to the shared server.
  tracking_uri: http://localhost:5001
  experiment: parkinsons-risk

selection:
  # The metric that picks the best candidate, and that tuning maximises: OFF within each patient,
  # what the dashboard shows (following one patient through the day). Pooled is still logged.
  metric: cv/state_now/off_auc_within

evaluation:
  # scripts/steps/evaluate.py: the pooled AUC's interval, patients resampled this many
  # times (ARCHITECTURE.md, Evaluation protocol).
  bootstrap_resamples: 1000
  interval: 0.95

validation_gate:
  # A candidate fails when one of these is missing or below its value. 0.5 is chance:
  # PLACEHOLDER until the baselines set a real floor.
  min:
    cv/state_now/off_auc: 0.5
    cv/tremor_now/any_tremor_auc: 0.5

release_gate:
  # MODEL.md, "Release gate and retraining". Each metric is a cross-validation
  # summary; must_improve true means strictly better, false means not worse.
  rules:
    - {metric: cv/state_now/off_auc, must_improve: true}
    - {metric: cv/state_now/off_auc_no_dbs, must_improve: false}
    - {metric: cv/tremor_now/any_tremor_auc, must_improve: false}
    - {metric: cv/state_now/dyskinetic_auc, must_improve: false}
    - {metric: cv/sleep_now/asleep_auc, must_improve: false}
    - {metric: cv/state_next_hour/off_auc, must_improve: false}

bias:
  # scripts/steps/bias.py (P3). The columns patients are sliced by: read from the hours table,
  # or from the patients table when the hours table doesn't have them (dbs).
  slice_columns: [sex, age_group, visit, dbs, hoehn_yahr, pd_subtype]
  # The largest gap allowed between the best and worst group, for a check that sets no max_gap.
  max_recall_gap: 0.10
  # A group is judged only with at least this many scored hours and this many patients. Most
  # slices describe the person, so a group of one patient measures that person, not the group.
  min_slice_rows: 20
  min_slice_participants: 2
  # Which predictions are sliced: cv (every development patient's out-of-fold hours) or test
  # (only after train.score_test has scored the test patients, once).
  predictions: cv
  # P(yes) at or above this counts as predicted yes, for the _recall, _precision and _fpr metrics.
  threshold: 0.5
  # The gates. metric is any core/metrics.py score of that label, or <question>_recall,
  # _precision or _fpr (questions: off, on, dyskinetic, asleep, any_tremor).
  # PLACEHOLDER max_gap values, for the team to agree.
  checks:
    - {label: state_now, metric: off_recall}
    - {label: state_now, metric: off_auc}
    - {label: tremor_now, metric: any_tremor_recall}
    - {label: sleep_now, metric: asleep_recall}
  mitigation:
    # Retrain a candidate that fails with reweighted training hours (Kamiran and Calders'
    # reweighing: each group and answer weighted as if they were independent).
    enabled: true
    # The candidates to retrain when they fail; empty means every failing candidate. Retraining
    # the transformer takes as long as training it.
    candidates: []
    # weight ** power, then capped at max_weight, so a tiny group can't dominate training.
    power: 1.0
    max_weight: 5.0

explain:
  # scripts/steps/explain.py (P3): Shapley values over each model's input groups (windows,
  # events, patients, features), and how the score changes when a group is left out.
  # The final models are explained on these patients: development (the ones they were trained
  # on: what the model relies on) or test (only once the test patients have been scored).
  patients: development
  # At most this many patients, picked with the seed, to keep the cost down; null for all.
  max_participants: 8
  # Each left-out group is replaced this many times with a different shuffle, and averaged.
  repeats: 3
  seed: 0
  # The candidates to explain; empty means all.
  candidates: []
  # What is explained: the probability of one question of a label.
  outputs:
    - {label: state_now, question: "off"}
    - {label: tremor_now, question: any_tremor}
    - {label: sleep_now, question: asleep}

export:
  # The release bundle's model family: the registry folder and the model_id prefix.
  family: parkinsons-risk
  # The model runs on the server (MODEL.md, "On the phone", update of 2026-11-13). Exporting
  # to the phone as well is optional, for testing whether on-device scoring can work.
  device:
    # Also build a phone file in the bundle's device/ folder.
    enabled: false
    # Only candidates that can be exported to the phone may be selected.
    required: false
    # PLACEHOLDER: executorch, onnx or litert, once a conversion is tested.
    format: null

registry:
  # PLACEHOLDER: the Backend's endpoint for registering a model version. None exists
  # yet (models are added with Backend's scripts/seed_models.py), so it's skipped.
  backend_url: null

alerts:
  email_enabled: true
  slack_enabled: true
