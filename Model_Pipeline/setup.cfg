# flake8's settings, for checks.yml's `flake8 model_pipeline tests` (run from this folder) and
# flake8 on a laptop. 120 matches the data pipeline's setup.cfg.
[flake8]
max-line-length = 120
# The virtualenv and run outputs, which a bare `flake8` here would otherwise check too.
exclude = .venv,__pycache__,logs,artifacts,mlruns
